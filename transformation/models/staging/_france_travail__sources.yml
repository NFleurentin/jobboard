version: 2

sources:
  - name: raw
    database: "{{ target.project }}"
    schema: raw
    tables:
      - name: france_travail_offers_ext
        description: "Donnée brute des offres France Travail, tel que déposé par Meltano (target-gcs), lue en place dans GCS par une table externe (Terraform). Un enregistrement par offre et par run d'extraction (full-refresh quotidien)."
        config:
          loaded_at_field: _ingested_at
          freshness:
            warn_after: { count: 36, period: hour }
            error_after: { count: 72, period: hour }
            # require_partition_filter impose un filtre sur la clé Hive ingested_at (STRING) ;
            # un filtre sur _ingested_at serait rejeté
            filter: "ingested_at >= format_timestamp('%Y%m%dT%H%M%SZ', timestamp_sub(current_timestamp(), interval 7 day))"
        columns:
          - name: id
            description: "Identifiant de l'offre côté France Travail."
            data_tests:
              - not_null:
                  config:
                    where: "ingested_at >= format_timestamp('%Y%m%dT%H%M%SZ', timestamp_sub(current_timestamp(), interval 7 day))"

          - name: dateActualisation
            description: "Date de dernière actualisation de l'offre, telle que renvoyée par l'API."
            data_tests:
              - not_null:
                  config:
                    where: "ingested_at >= format_timestamp('%Y%m%dT%H%M%SZ', timestamp_sub(current_timestamp(), interval 7 day))"

          - name: _raw
            description: "Payload JSON complet de l'offre, sérialisé en texte (voir choix techniques : contourne un bug de sérialisation Decimal/orjson du target)."
            data_tests:
              - not_null:
                  config:
                    where: "ingested_at >= format_timestamp('%Y%m%dT%H%M%SZ', timestamp_sub(current_timestamp(), interval 7 day))"

          - name: _extracted_at
            description: "Horodatage précis auquel le tap a récupéré cet enregistrement depuis l'API, à la ligne près."
            data_tests:
              - not_null:
                  config:
                    where: "ingested_at >= format_timestamp('%Y%m%dT%H%M%SZ', timestamp_sub(current_timestamp(), interval 7 day))"

          - name: _ingested_at
            description: "Identifiant du run d'extraction/chargement (une seule valeur par run, partagée par toutes ses lignes). Utilisé pour le partitionnement et le dédoublonnage en staging."
            data_tests:
              - not_null:
                  config:
                    where: "ingested_at >= format_timestamp('%Y%m%dT%H%M%SZ', timestamp_sub(current_timestamp(), interval 7 day))"

          - name: ingested_at
            description: "Clé de partition Hive, tirée du dossier GCS du run (ingested_at=<INGESTED_AT>), au format %Y%m%dT%H%M%SZ. Ajoutée par BigQuery, absente des fichiers. Seul filtre qui élague : toute requête doit la filtrer (require_partition_filter)."
