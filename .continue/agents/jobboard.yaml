# Agent Continue du dépôt jobboard, avec des modèles locaux servis par Ollama.
#
# Les règles pointent vers les fichiers de Claude Code, qui restent la source
# unique : ne pas les recopier ici. Les chemins relatifs sont résolus depuis
# le dossier de ce fichier (.continue/agents/).
#
# Continue lit la clé `globs:` du frontmatter (Claude Code lit `paths:`) :
# une règle avec `globs:` n'est injectée que si un fichier correspondant est
# dans le contexte. Une règle sans `globs:` est injectée à chaque requête.
name: jobboard (LLM local)
version: 0.0.1
schema: v1

models:
  - name: Devstral Small 2
    provider: ollama
    model: devstral-small-2:latest
    roles:
      - chat
      - edit
      - apply
    defaultCompletionOptions:
      # Transmis à Ollama comme num_ctx : les règles injectées en consomment
      # une bonne partie, une valeur trop basse les tronque silencieusement.
      contextLength: 32768

  - name: Qwen2.5 Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - autocomplete

# Providers @ ajoutés à ceux chargés par défaut (file, currentFile, diff,
# terminal, problems, rules), qu'il est inutile de déclarer.
context:
  - provider: code
  - provider: folder

rules:
  # Toujours injectées
  - uses: ../../CLAUDE.md
  - uses: ../../dbt/CLAUDE.md
  - uses: ../../extraction/CLAUDE.md
  - uses: ../../infra/CLAUDE.md
  - uses: ../../.claude/rules/git.md
  - uses: ../../.claude/rules/github.md
  # Injectées selon leurs globs
  - uses: ../../.claude/rules/bash.md
  - uses: ../../.claude/rules/bigquery.md
  - uses: ../../.claude/rules/dbt.md
  - uses: ../../.claude/rules/meltano.md
  - uses: ../../.claude/rules/python.md
  - uses: ../../.claude/rules/terraform_gcp.md
