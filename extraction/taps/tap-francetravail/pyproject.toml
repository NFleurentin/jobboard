[project]
name = "tap-francetravail"
version = "0.1.0"
description = "Singer tap pour l'API Offres d'emploi de France Travail"
requires-python = ">=3.11"
dependencies = [
    "singer-sdk~=0.54.5",
]

[project.scripts]
tap-francetravail = "tap_francetravail.tap:TapFranceTravail.cli"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tap_francetravail"]