name: terraform apply

# Workflow réutilisable (issue #106) : plan de envs/<environment> au commit donné, publié
# dans le résumé du job, puis apply d'un plan identique. Appelé par terraform-dev.yml
# (merge sur main) et terraform-prod.yml (promotion d'une release) : le chemin de la prod
# est ainsi exercé en dev. Logique dans infra/ci/plan.sh, lu depuis le commit déployé.
#
# Le fichier tfplan contient des valeurs sensibles en clair : il ne passe pas d'un job à
# l'autre (un artifact est téléchargeable sur un dépôt public). Le job apply refait le plan
# et ne l'applique que si son empreinte est celle du plan publié par le job plan.
# En prod, chaque job attend l'approbation de l'environment prod : la première lance le
# plan, la seconde, après lecture du résumé, l'applique.
on:
  workflow_call:
    inputs:
      environment:
        description: "dev ou prod : GitHub Environment et racine envs/<environment>"
        type: string
        required: true
      ref:
        description: "SHA du commit dont le code Terraform est déployé"
        type: string
        required: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # requis pour obtenir le jeton OIDC (Workload Identity Federation)
    # sa-deployer de l'environnement ; prod : approbation manuelle et branche main seule
    environment: ${{ inputs.environment }}
    outputs:
      fingerprint: ${{ steps.plan.outputs.fingerprint }}
      changes: ${{ steps.plan.outputs.changes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false # ce job ne pousse rien : pas de jeton gardé sur le runner

      # Installation avant l'authentification GCP : le code téléchargé ne voit pas les credentials.
      # terraform.env vient du commit déployé : la version suit le code et son lockfile.
      - name: Lire la version de Terraform
        run: grep -E '^TF_(VERSION|SHA256)=' infra/terraform.env >> "$GITHUB_ENV"

      - name: Installer Terraform
        run: |
          archive="$RUNNER_TEMP/terraform.zip"
          curl -fsSL -o "$archive" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/terraform"
          unzip -q -d "$RUNNER_TEMP/terraform" "$archive"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Plan
        id: plan
        run: ./infra/ci/plan.sh "envs/${TARGET_ENV}"
        env:
          TARGET_ENV: ${{ inputs.environment }}
          # Secret plutôt que variable : adresse personnelle, masquée dans les logs
          TF_VAR_user_email: ${{ secrets.TF_VAR_USER_EMAIL }}

  apply:
    needs: plan
    # Plan vide : rien à appliquer, pas de seconde approbation en prod
    if: needs.plan.outputs.changes == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # requis pour obtenir le jeton OIDC (Workload Identity Federation)
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false # ce job ne pousse rien : pas de jeton gardé sur le runner

      - name: Lire la version de Terraform
        run: grep -E '^TF_(VERSION|SHA256)=' infra/terraform.env >> "$GITHUB_ENV"

      - name: Installer Terraform
        run: |
          archive="$RUNNER_TEMP/terraform.zip"
          curl -fsSL -o "$archive" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/terraform"
          unzip -q -d "$RUNNER_TEMP/terraform" "$archive"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Apply du plan relu
        run: ./infra/ci/plan.sh --apply "$FINGERPRINT" "envs/${TARGET_ENV}"
        env:
          TARGET_ENV: ${{ inputs.environment }}
          FINGERPRINT: ${{ needs.plan.outputs.fingerprint }}
          TF_VAR_user_email: ${{ secrets.TF_VAR_USER_EMAIL }}
