name: CI

# Validation statique des pull requests : aucun accès à GCP, aucun secret, aucun coût.
# Pas de filtre paths : les noms de jobs sont des checks obligatoires du ruleset de main,
# un workflow non déclenché laisserait la PR bloquée en attente de leur statut.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    # Nom figé : check obligatoire dans infra/github/ruleset-main.json
    name: python (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: loading
            dir: loading
          - name: tap-francetravail
            dir: extraction/taps/tap-francetravail
    defaults:
      run:
        working-directory: ${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"

      - name: Installer Python et les dépendances, dont le groupe dev (versions figées par uv.lock)
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run --frozen ruff check .

      - name: Format (ruff)
        run: uv run --frozen ruff format --check .

      - name: Typage (mypy)
        run: uv run --frozen mypy

      - name: Tests (pytest)
        run: uv run --frozen pytest

  terraform:
    # Nom figé : check obligatoire dans infra/github/ruleset-main.json
    name: terraform
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    env:
      # Archive officielle, version et empreinte figées (publiée dans terraform_<version>_SHA256SUMS).
      # Pas d'action setup-terraform : hashicorp/* n'est pas dans les actions autorisées du dépôt.
      TF_VERSION: "1.16.5"
      TF_SHA256: "2bc2fcfff033265c9e02ca0351f01794eb122f62a9b2a49a3294b9e49eaab5e4"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Terraform
        run: |
          archive="$RUNNER_TEMP/terraform.zip"
          curl -fsSL -o "$archive" \
            "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          echo "${TF_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/terraform"
          unzip -q -d "$RUNNER_TEMP/terraform" "$archive"
          echo "$RUNNER_TEMP/terraform" >> "$GITHUB_PATH"

      - name: Format
        run: terraform fmt -check -recursive infra

      # -backend=false : aucun accès au state GCS. -lockfile=readonly : échec si les providers
      # ne correspondent pas au .terraform.lock.hcl versionné. Les modules sont validés via les racines.
      - name: Validation des racines
        run: |
          for root in infra/envs/dev infra/envs/prod infra/identity/dev infra/identity/prod; do
            echo "::group::${root}"
            terraform -chdir="$root" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$root" validate
            echo "::endgroup::"
          done

  dbt:
    # Nom figé : check obligatoire dans infra/github/ruleset-main.json
    name: dbt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: transformation
    env:
      # Exigé par profiles.yml ; aucune connexion n'est ouverte par parse, lint et format
      GCP_PROJECT_ID: ci-no-connection
      # Exigée par eph_france_travail__offers.sql (fournie par load.py en exécution réelle)
      DBT_CI_VARS: '{ingested_at: "19700101T000000Z"}'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Même version que le pipeline de prod : la CI valide ce qui sera exécuté
      - name: Lire la version de dbt Fusion
        run: grep -E '^DBT_(VERSION|SHA256)=' dbt-fusion.env >> "$GITHUB_ENV"

      - name: Installer dbt Fusion
        run: |
          archive="$RUNNER_TEMP/dbt.tar.gz"
          curl -fsSL -o "$archive" \
            "https://public.cdn.getdbt.com/fs/cli/fs-v${DBT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DBT_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dbt"
          tar -C "$RUNNER_TEMP/dbt" -xzf "$archive"
          echo "$RUNNER_TEMP/dbt" >> "$GITHUB_PATH"

      - name: Installer les paquets dbt (versions figées par package-lock.yml)
        run: dbt deps

      - name: Parse
        run: dbt parse

      - name: Lint (règles de .sqlfluff)
        run: dbt lint --vars "$DBT_CI_VARS"

      - name: Format
        run: dbt format --check --vars "$DBT_CI_VARS"
