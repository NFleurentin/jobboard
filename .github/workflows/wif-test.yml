name: WIF test
on: workflow_dispatch

permissions:
  contents: read
  id-token: write # indispensable : autorise GitHub à émettre le jeton OIDC

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: dev
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: |
          gcloud auth list
          gcloud storage ls --project=${{ vars.GCP_PROJECT_ID }}

  prod:
    needs: dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: prod # approbation manuelle exigée
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - run: |
          gcloud auth list
          gcloud storage ls --project=${{ vars.GCP_PROJECT_ID }}
