name: Pipeline France Travail

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 07:00 (été) / 06:00 (hiver) heure de Paris
  workflow_dispatch: # déclenchement manuel, depuis l'onglet Actions ou gh workflow run
    inputs:
      environment:
        description: "Environnement cible"
        type: choice
        options: [dev, prod]
        default: dev # un lancement manuel utilisera l'environnement dev par défaut
        required: true
      load_only:
        description: "Chargement seul, sans collecte (rattrapage des runs terminés)"
        type: boolean
        default: false

concurrency:
  group: france-travail-pipeline
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  extract:
    if: ${{ !inputs.load_only }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # requis pour obtenir le jeton OIDC (Workload Identity Federation)

    # Seul un lancement manuel avec environment=dev cible dev ; le schedule (input vide) va en prod.
    # prod-collect : limité à sa-extract et à la branche main, sans approbation manuelle.
    environment: ${{ inputs.environment == 'dev' && 'dev' || 'prod-collect' }}
    env:
      MELTANO_ENVIRONMENT: ${{ inputs.environment == 'dev' && 'dev' || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Générer les identifiants du run
        run: |
          echo "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "INGESTED_AT=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      # Installation avant l'authentification GCP : le code téléchargé ne voit pas les credentials
      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"

      - name: Installer Python et Meltano (versions figées par .python-version et uv.lock)
        working-directory: extraction
        run: |
          uv sync --frozen
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.EXTRACT_SA }}

      - name: Installer les plugins Meltano (tap et target)
        working-directory: extraction
        run: meltano --environment="$MELTANO_ENVIRONMENT" install

      - name: Extraction
        working-directory: extraction
        run: ./run.sh
        env:
          TAP_FRANCETRAVAIL_CLIENT_ID: ${{ secrets.TAP_FRANCETRAVAIL_CLIENT_ID }}
          TAP_FRANCETRAVAIL_CLIENT_SECRET: ${{ secrets.TAP_FRANCETRAVAIL_CLIENT_SECRET }}

  load:
    needs: extract
    # Tourne aussi après une collecte en échec ou sautée (load_only) : load.py ne lit
    # que les runs terminés (_SUCCESS) et rattrape ceux en attente. Pas après une annulation.
    # Temporaire : sauté sur le schedule, le chargement ne se lance qu'à la main.
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # requis pour obtenir le jeton OIDC (Workload Identity Federation)

    # Même règle que la collecte ; prod-load : limité à sa-dbt et à la branche main, sans approbation.
    environment: ${{ inputs.environment == 'dev' && 'dev' || 'prod-load' }}
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      DBT_TARGET: ${{ inputs.environment == 'dev' && 'dev' || 'prod' }}
      # dbt Fusion n'est pas un paquet Python : archive officielle, version et empreinte figées
      # (empreinte publiée par le CDN dans <archive>.sha256). Le script d'installation de dbt Labs
      # n'est pas utilisé : il ne vérifie pas l'empreinte et installe jq au passage.
      DBT_VERSION: "2.0.6"
      DBT_SHA256: "64611a38348383eae86a4834611cfc786f96cdbc907fbdf93825c5560d20c197"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installations avant l'authentification GCP : le code téléchargé ne voit pas les credentials
      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.17"

      - name: Installer Python et les bibliothèques GCP (versions figées par .python-version et uv.lock)
        working-directory: loading
        run: uv sync --frozen

      - name: Installer dbt Fusion
        run: |
          archive="$RUNNER_TEMP/dbt.tar.gz"
          curl -fsSL -o "$archive" \
            "https://public.cdn.getdbt.com/fs/cli/fs-v${DBT_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DBT_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dbt"
          tar -C "$RUNNER_TEMP/dbt" -xzf "$archive"
          echo "$RUNNER_TEMP/dbt" >> "$GITHUB_PATH"

      - name: Installer les paquets dbt (versions figées par package-lock.yml)
        working-directory: transformation
        run: dbt deps

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DBT_SA }}

      - name: Chargement (snapshot des runs terminés, puis modèles en aval)
        working-directory: loading
        run: uv run load.py
