name: Extraction France Travail

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC = 07:00 (été) / 06:00 (hiver) heure de Paris
  workflow_dispatch: # permet aussi un déclenchement manuel depuis l'onglet Actions

permissions:
  contents: read
  id-token: write # requis pour obtenir le jeton OIDC (Workload Identity Federation)

jobs:
  extract-and-load:
    runs-on: ubuntu-latest
    environment: prod-collect # limité à sa-extract, sans approbation manuelle

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Générer les identifiants du run
        run: |
          echo "MELTANO_ENVIRONMENT=prod" >> "$GITHUB_ENV"
          echo "GCP_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}" >> "$GITHUB_ENV"
          echo "INGESTED_AT=$(date -u +%Y%m%dT%H%M%SZ)" >> "$GITHUB_ENV"

      - name: Authentification GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.EXTRACT_SA }}

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Meltano (avec support GCS pour le state)
        run: pip install "meltano[gcs]"

      - name: Installer les plugins Meltano (tap et target)
        working-directory: extraction
        run: meltano --environment="$MELTANO_ENVIRONMENT" install
        env:
          TAP_FRANCETRAVAIL_CLIENT_ID: ${{ secrets.TAP_FRANCETRAVAIL_CLIENT_ID }}
          TAP_FRANCETRAVAIL_CLIENT_SECRET: ${{ secrets.TAP_FRANCETRAVAIL_CLIENT_SECRET }}

      - name: Extraction
        working-directory: extraction
        run: ./run.sh
        env:
          TAP_FRANCETRAVAIL_CLIENT_ID: ${{ secrets.TAP_FRANCETRAVAIL_CLIENT_ID }}
          TAP_FRANCETRAVAIL_CLIENT_SECRET: ${{ secrets.TAP_FRANCETRAVAIL_CLIENT_SECRET }}

      - name: Chargement BigQuery
        working-directory: loading
        run: ./load.sh
